
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BXB AI Studio</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #101018;
            color: #f5f5f7;
            display: grid;
            place-items: center;
        }

        main {
            width: min(90%, 650px);
            text-align: center;
        }

        .logo {
            color: #b99aff;
            font-size: 14px;
            letter-spacing: 4px;
        }

        h1 {
            font-size: clamp(36px, 7vw, 58px);
            margin-bottom: 12px;
        }

        p {
            color: #aaaaba;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 24px;
            padding: 13px 24px;
            background: #8b5cf6;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

        a:hover {
            background: #7c3aed;
        }
    </style>
</head>
<body>
    <main>
        <div class="logo">BXB</div>
        <h1>AI Studio</h1>
        <p>
            Your workspace for intelligent tools,
            creative ideas, and productivity.
        </p>
        <a href="/assistant/">Open AI Assistant</a>
    </main>
</body>
</html>
